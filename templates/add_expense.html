{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}
<div class="auth-section">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Add Expense</h1>
            <p class="auth-subtitle">Enter the details of your transaction below.</p>
        </div>

        <div class="auth-card">
            <form method="POST" action="{{ url_for('add_expense') }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" step="0.01" min="0.01" name="amount" id="amount"
                           class="form-input"
                           value="{{ form_data.get('amount', '') }}" required placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select name="category" id="category" class="form-input" required>
                        <option value="" disabled {% if not form_data.get('category') %}selected{% endif %}>Select a category</option>
                        {% for cat in EXPENSE_CATEGORIES %}
                            <option value="{{ cat }}" {% if form_data.get('category') == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" name="date" id="date" class="form-input"
                           value="{{ form_data.get('date', '') }}" required>
                </div>

                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <input type="text" name="description" id="description" maxlength="200"
                           class="form-input"
                           value="{{ form_data.get('description', '') }}" placeholder="What was this for?">
                </div>

                <button type="submit" class="btn-submit">Save Expense</button>
            </form>
        </div>

        <div class="auth-switch">
            <a href="{{ url_for('profile') }}">Cancel and return to profile</a>
        </div>
    </div>
</div>
{% endblock %}
