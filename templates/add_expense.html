{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Add Expense</h1>
    <a href="{{ url_for('profile') }}" class="btn btn-secondary">Cancel</a>
</div>

<div class="card">
    <form method="POST" action="{{ url_for('add_expense') }}" class="form">
        <div class="form-group">
            <label for="amount">Amount (₹)</label>
            <input type="number" step="0.01" min="0.01" name="amount" id="amount"
                   value="{{ form_data.get('amount', '') }}" required placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select name="category" id="category" required>
                <option value="" disabled {% if not form_data.get('category') %}selected{% endif %}>Select a category</option>
                {% for cat in EXPENSE_CATEGORIES %}
                    <option value="{{ cat }}" {% if form_data.get('category') == cat %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" name="date" id="date"
                   value="{{ form_data.get('date', '') }}" required>
        </div>

        <div class="form-group">
            <label for="description">Description (Optional)</label>
            <input type="text" name="description" id="description" maxlength="200"
                   value="{{ form_data.get('description', '') }}" placeholder="What was this for?">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Expense</button>
        </div>
    </form>
</div>
{% endblock %}
